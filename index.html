
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辩手训练场 - 极简主义思辨空间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Noto+Serif+SC:wght@700&display=swap');
        
        :root {
            --bg-deep: #0a0c10;
            --accent: #f97316;
            --text-warm: #f1f5f9;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-warm);
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @keyframes flow-danmu {
            from { transform: translateX(110%); }
            to { transform: translateX(-250%); }
        }
        .danmu-item {
            position: absolute;
            white-space: nowrap;
            animation: flow-danmu 10s linear infinite;
            pointer-events: none;
            opacity: 0.4;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }

        .glass {
            background: rgba(18, 21, 28, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .minimal-input {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .minimal-input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.04);
        }
    </style>
<script type="importmap">

}

</head>

    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
